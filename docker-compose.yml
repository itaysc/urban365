# Local Postgres for development. Production runs Railway's managed Postgres instead —
# see the README. Start with: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: nadlan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nadlan
      POSTGRES_PASSWORD: nadlan
      POSTGRES_DB: nadlan
    ports:
      - '5432:5432'
    volumes:
      - nadlan-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nadlan -d nadlan']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nadlan-pgdata:
