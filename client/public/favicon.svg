<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Urban365">
  <title>Urban365</title>

  <!--
    The small cut of the mark: a roofline over a U. The full lockup — the same roof
    over "U365" — is what the home-screen icons and the share image carry; see
    client/brand/lockup.svg. At 16 and 32 px four characters are noise, so the tab
    gets the one letter the eye can resolve, and the roof is what makes the two cuts
    read as the same thing.

    A solid tile rather than a transparent mark: a favicon sits on whatever colour
    the tab strip happens to be, light or dark, and a mark alone disappears against
    one of them. The blue is the brand's own (blue-700), so the tab matches the header.

    Paths, not text. The previous version set "U365" in the machine's system font,
    which is a different font on a Mac, a PC and a phone — this looks the same
    everywhere, and it needs no font to exist.
  -->
  <rect width="64" height="64" rx="14" fill="#1d4ed8" />
  <path d="M15 25 32 11l17 14" fill="none" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" />
  <path d="M22 28v12a10 10 0 0 0 20 0V28" fill="none" stroke="#ffffff" stroke-width="8" />
</svg>
