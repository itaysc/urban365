<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!--
      The tab gets the SVG: sharp at whatever size the browser asks for. The .ico is
      for the tools that still fetch /favicon.ico without reading this file, and the
      180 px PNG is for iOS, which ignores an SVG icon when somebody adds the site to
      their home screen and would otherwise use a screenshot of the page. Android and
      the install prompt read the manifest. Every one of these comes out of
      scripts/make-icons.mjs; do not edit the PNGs by hand.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1d4ed8" />
    <!--
      What a shared link shows. WhatsApp, Facebook, LinkedIn and X all read og:image,
      and without one a share is a bare URL. It has to be absolute, and the client
      cannot know its own origin at build time, so Vite fills VITE_APP_URL in from the
      build's environment — set it to the site's public origin, no trailing slash.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:site_name" content="Urban365" />
    <meta property="og:title" content="Urban365" />
    <meta property="og:description" content="נדל״ן לפי עסקאות שנרשמו בפועל — חיפוש, הערכת שווי ומחשבון משכנתא." />
    <meta property="og:image" content="%VITE_APP_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Urban365</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XJZ5EMCP2H"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-XJZ5EMCP2H');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Open-Nagish: the accessibility toolbar, as used in foozool-initiatives. It reads
      `<html lang="he">` above, so the panel comes up in Hebrew without being asked.

      Config must be defined before the script runs, which is why it sits here rather
      than in <head> with a deferred script above it.

      It is a third-party script from a CDN, so visitors' browsers fetch it from
      jsdelivr. Pinned to an exact version rather than a range for that reason.
    -->
    <script>
      window.OpenNagishConfig = {
        language: 'he',
        position: 'bottom-left',
        statementUrl: '/accessibility',
        statementData: {
          orgName: 'Urban365',
          // The accessibility coordinator's mailbox, the same one `/accessibility`
          // publishes. The toolbar can generate a statement of its own from these, and
          // one that gave a different address from ours would be the worse of the two.
          orgEmail: 'accessibility@urban365.com',
        },
      };
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/open-nagish@1.1.4/dist/open-nagish.min.js"
      defer
    ></script>
  </body>
</html>
