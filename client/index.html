<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!--
      An SVG icon, so the tab mark is sharp at whatever size the browser asks for and
      there is one file to change rather than a set of sizes to regenerate.

      The PNG beside it is for iOS: Safari ignores an SVG icon when somebody adds the
      site to their home screen, and without this it uses a screenshot of the page.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Urban365</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XJZ5EMCP2H"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-XJZ5EMCP2H');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Open-Nagish: the accessibility toolbar, as used in foozool-initiatives. It reads
      `<html lang="he">` above, so the panel comes up in Hebrew without being asked.

      Config must be defined before the script runs, which is why it sits here rather
      than in <head> with a deferred script above it.

      It is a third-party script from a CDN, so visitors' browsers fetch it from
      jsdelivr. Pinned to an exact version rather than a range for that reason.
    -->
    <script>
      window.OpenNagishConfig = {
        language: 'he',
        position: 'bottom-left',
        statementUrl: '/accessibility',
        statementData: {
          orgName: 'Urban365',
          // The accessibility coordinator's mailbox, the same one `/accessibility`
          // publishes. The toolbar can generate a statement of its own from these, and
          // one that gave a different address from ours would be the worse of the two.
          orgEmail: 'accessibility@urban365.com',
        },
      };
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/open-nagish@1.1.4/dist/open-nagish.min.js"
      defer
    ></script>
  </body>
</html>
